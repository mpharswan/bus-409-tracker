name: Track route 409

# Records route 409 every day in two windows, Galway (Europe/Dublin) time:
#   08:00-10:00 and 15:00-18:00
# Within a window, runs chain back to back. The cron below starts each window
# (placed at :23 because GitHub often skips jobs scheduled exactly on the hour).

on:
  schedule:
    # Fires 06:23-09:23 and 13:23-17:23 UTC. Runs outside a window exit at once;
    # a run up to 60 min before a window waits for it to open. Covers both summer
    # time (UTC+1) and winter time after the clocks change on 25 October (UTC+0).
    - cron: "23 6-9,13-17 * * *"
  workflow_dispatch: {}

concurrency:
  group: track-409
  cancel-in-progress: false

permissions:
  contents: write
  actions: write

env:
  TZ: Europe/Dublin
  WINDOWS: "08:00-10:00 15:00-18:00"

jobs:
  track:
    runs-on: ubuntu-latest
    timeout-minutes: 75
    steps:
      - name: Work out how long to record
        id: window
        run: |
          now=$(date +%s)
          mins=0
          for w in $WINDOWS; do
            start=$(date -d "today ${w%-*}" +%s)
            end=$(date -d "today ${w#*-}" +%s)
            if [ "$now" -ge "$start" ] && [ "$now" -lt "$end" ]; then
              left=$(( (end - now) / 60 ))
              mins=$(( left < 55 ? left : 55 ))
              echo "Inside the ${w} window."
              break
            fi
            if [ "$now" -lt "$start" ] && [ $((start - now)) -le 3600 ]; then
              echo "Waiting $(( (start - now) / 60 )) min for the ${w} window to open."
              sleep $((start - now))
              left=$(( (end - start) / 60 ))
              mins=$(( left < 55 ? left : 55 ))
              break
            fi
          done
          if [ "$mins" -le 0 ]; then
            mins=0
            echo "Outside the tracking windows (${WINDOWS}) - nothing to record."
          else
            echo "Recording for $mins minutes."
          fi
          echo "minutes=$mins" >> "$GITHUB_OUTPUT"

      - uses: actions/checkout@v4
        if: steps.window.outputs.minutes != '0'

      - uses: actions/setup-python@v5
        if: steps.window.outputs.minutes != '0'
        with:
          python-version: "3.12"

      - name: Record 409 buses
        if: steps.window.outputs.minutes != '0'
        env:
          NTA_API_KEY: ${{ secrets.NTA_API_KEY }}
        run: python track_409.py --minutes ${{ steps.window.outputs.minutes }}

      - name: Save results to the repository
        if: always() && steps.window.outputs.minutes != '0'
        run: |
          git config user.name "409 tracker"
          git config user.email "actions@users.noreply.github.com"
          git add -A 409_delays.csv 409_state.json 409_trips.json || true
          if git diff --cached --quiet; then
            echo "Nothing new to save."
            exit 0
          fi
          git commit -m "Log 409 delays $(date '+%Y-%m-%d %H:%M')"
          for i in 1 2 3; do
            git pull --rebase -X theirs && git push && exit 0
            sleep 10
          done
          exit 1

      - name: Start the next run straight away (until the window closes)
        if: always() && steps.window.outputs.minutes != '0'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          now=$(date +%s)
          for w in $WINDOWS; do
            start=$(date -d "today ${w%-*}" +%s)
            end=$(date -d "today ${w#*-}" +%s)
            if [ "$now" -ge "$start" ] && [ $((end - now)) -gt 120 ]; then
              gh workflow run track.yml --repo "$GITHUB_REPOSITORY" --ref main
              echo "Next run requested (window ${w})."
              exit 0
            fi
          done
          echo "Window closed - the schedule will start the next one."
